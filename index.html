<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- School crest, generated from src/assets/mosailogo-removebg-preview.png.
         The .ico is listed first and unsized because that is the file anything
         old asks for by name; the PNGs let a modern browser pick the size it
         actually needs instead of scaling a 16px image up a retina tab. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Dark theme is switched off for now. To restore it, uncomment this script
         (it applies the saved light/dark theme before first paint).
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mosai.theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) { /* storage blocked: stay light */ }
      })();
    </script>
    -->

    <!-- Primary meta tags -->
    <title>MOSAI Schools: Where Every Child Shines! | Katabi, Wakiso, Uganda</title>
    <meta
      name="description"
      content="MOSAI Schools is a God fearing, nurturing school in Katabi, Wakiso District, Uganda, offering quality early years and primary education across our Nalugala and Bunono campuses. Apply today."
    />
    <meta name="author" content="MOSAI Schools" />
    <meta name="theme-color" content="#0b2a5b" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.mosaischools.ug/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MOSAI Schools" />
    <meta property="og:url" content="https://www.mosaischools.ug/" />
    <meta property="og:title" content="MOSAI Schools: Where Every Child Shines!" />
    <meta
      property="og:description"
      content="A God fearing, nurturing school in Katabi, Wakiso District, Uganda. Quality early years and primary education across our Nalugala and Bunono campuses."
    />
    <meta property="og:image" content="https://www.mosaischools.ug/og-image.jpg" />
    <meta property="og:locale" content="en_UG" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MOSAI Schools: Where Every Child Shines!" />
    <meta
      name="twitter:description"
      content="A God fearing, nurturing school in Katabi, Wakiso District, Uganda. Quality early years and primary education."
    />
    <meta name="twitter:image" content="https://www.mosaischools.ug/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
